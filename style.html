<style>
  /* =====================================
   VARIABLES
===================================== */

  :root {
    --primary: #2563eb;

    --primary-dark: #1d4ed8;

    --success: #198754;

    --danger: #dc3545;

    --warning: #f59e0b;

    --background: #f5f7fb;

    --card: #ffffff;

    --border: #e5e7eb;

    --text: #1f2937;

    --muted: #6b7280;

    --shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
  }

  /* =====================================
   RESET
===================================== */

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;

    background: var(--background);

    color: var(--text);
  }

  /* =====================================
   HEADER
===================================== */

  .topbar {
    background: #ffffff;

    border-bottom: 1px solid var(--border);

    position: sticky;

    top: 0;

    z-index: 100;
  }

  .header-inner {
    max-width: 1250px;

    margin: auto;

    padding: 18px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;
  }

  .header-inner h1 {
    margin: 0 0 5px;

    font-size: 25px;
  }

  .header-inner p {
    margin: 0;

    color: var(--muted);

    font-size: 14px;
  }

  /* =====================================
   CONTAINER
===================================== */

  .container {
    max-width: 1250px;

    margin: auto;

    padding: 25px 20px 50px;
  }

  /* =====================================
   BUTTON
===================================== */

  .btn {
    border: 0;

    border-radius: 8px;

    padding: 10px 14px;

    cursor: pointer;

    font-size: 14px;

    font-weight: 600;

    transition: 0.2s;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 5px;
  }

  .btn:hover {
    transform: translateY(-1px);
  }

  .btn.primary {
    background: var(--primary);

    color: #ffffff;
  }

  .btn.primary:hover {
    background: var(--primary-dark);
  }

  .btn.edit {
    background: #fff3cd;

    color: #856404;
  }

  .btn.danger {
    background: #f8d7da;

    color: #842029;
  }

  .btn.pdf {
    background: #e0e7ff;

    color: #3730a3;
  }

  .btn.download {
    background: var(--success);

    color: #ffffff;
  }

  .btn.download:hover {
    background: #157347;
  }

  .btn.ghost {
    background: #f3f4f6;

    color: #374151;
  }

  /* =====================================
   TOOLBAR
===================================== */

  .toolbar {
    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

    margin-bottom: 25px;
  }

  .search-box {
    flex: 1;

    max-width: 500px;
  }

  .search-box input {
    width: 100%;

    padding: 13px 15px;

    border: 1px solid var(--border);

    border-radius: 9px;

    outline: none;

    background: #ffffff;

    font-size: 14px;
  }

  .search-box input:focus {
    border-color: var(--primary);

    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .total-box {
    background: #ffffff;

    border: 1px solid var(--border);

    padding: 12px 18px;

    border-radius: 9px;

    white-space: nowrap;

    color: var(--muted);
  }

  .total-box strong {
    color: var(--text);

    margin-left: 5px;
  }

  /* =====================================
   GRID
===================================== */

  .document-grid {
    display: grid;

    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));

    gap: 22px;
  }

  /* =====================================
   CARD
===================================== */

  .document-card {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 14px;

    overflow: hidden;

    box-shadow: var(--shadow);

    transition: 0.25s;
  }

  .document-card:hover {
    transform: translateY(-3px);

    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  }

  /* =====================================
   IMAGE
===================================== */

  .card-image {
    width: 100%;

    height: 220px;

    object-fit: cover;

    display: block;

    cursor: zoom-in;

    background: #f1f5f9;
  }

  .card-body {
    padding: 17px;
  }

  .card-name {
    margin: 0 0 9px;

    font-size: 19px;

    line-height: 1.3;

    word-break: break-word;
  }

  .card-description {
    margin: 0 0 15px;

    color: var(--muted);

    line-height: 1.5;

    font-size: 14px;

    min-height: 42px;
  }

  /* =====================================
   GALLERY
===================================== */

  .gallery {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 6px;

    margin: 12px 0 16px;
  }

  .gallery img {
    width: 100%;

    height: 65px;

    object-fit: cover;

    border-radius: 6px;

    cursor: zoom-in;

    background: #f1f5f9;
  }

  /* =====================================
   CARD ACTIONS
===================================== */

  .card-actions {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;
  }

  .card-actions .btn {
    width: 100%;
  }

  /* =====================================
   EMPTY
===================================== */

  .empty-state {
    text-align: center;

    padding: 80px 20px;

    color: var(--muted);
  }

  .empty-icon {
    font-size: 55px;

    margin-bottom: 15px;
  }

  .empty-state h2 {
    color: var(--text);

    margin: 0 0 8px;
  }

  /* =====================================
   MODAL
===================================== */

  .modal {
    position: fixed;

    inset: 0;

    background: rgba(15, 23, 42, 0.6);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 1000;
  }

  .modal.show {
    display: flex;
  }

  .modal-box {
    background: #ffffff;

    width: 100%;

    max-width: 650px;

    max-height: 90vh;

    overflow-y: auto;

    border-radius: 15px;

    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
  }

  .modal-header {
    padding: 20px;

    border-bottom: 1px solid var(--border);

    display: flex;

    justify-content: space-between;

    align-items: flex-start;
  }

  .modal-header h2 {
    margin: 0 0 5px;
  }

  .modal-header p {
    margin: 0;

    color: var(--muted);

    font-size: 13px;
  }

  .close-btn {
    border: 0;

    background: transparent;

    font-size: 28px;

    cursor: pointer;

    color: var(--muted);

    line-height: 1;
  }

  /* =====================================
   FORM
===================================== */

  #documentForm {
    padding: 20px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;

    font-weight: 600;

    margin-bottom: 7px;

    font-size: 14px;
  }

  .form-group label span {
    color: var(--danger);
  }

  .form-group input[type="text"],
  .form-group textarea,
  .form-group input[type="file"] {
    width: 100%;
  }

  .form-group input[type="text"],
  .form-group textarea {
    border: 1px solid var(--border);

    border-radius: 8px;

    padding: 11px 12px;

    font-family: inherit;

    font-size: 14px;

    outline: none;
  }

  .form-group textarea {
    resize: vertical;
  }

  .form-group input[type="text"]:focus,
  .form-group textarea:focus {
    border-color: var(--primary);

    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .form-group input[type="file"] {
    border: 1px dashed #cbd5e1;

    padding: 12px;

    border-radius: 8px;

    background: #f8fafc;
  }

  .form-group small {
    display: block;

    margin-top: 6px;

    color: var(--muted);

    font-size: 12px;
  }

  /* =====================================
   CHECKBOX
===================================== */

  .checkbox-group {
    margin-bottom: 18px;

    padding: 12px;

    background: #f8fafc;

    border-radius: 8px;
  }

  .checkbox-group label {
    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 14px;
  }

  /* =====================================
   FORM ACTION
===================================== */

  .form-actions {
    display: flex;

    justify-content: flex-end;

    gap: 10px;

    padding-top: 10px;
  }

  /* =====================================
   LIGHTBOX
===================================== */

  .lightbox {
    position: fixed;

    inset: 0;

    background: rgba(0, 0, 0, 0.9);

    display: none;

    align-items: center;

    justify-content: center;

    padding: 30px;

    z-index: 2000;
  }

  .lightbox.show {
    display: flex;
  }

  .lightbox img {
    max-width: 95vw;

    max-height: 90vh;

    object-fit: contain;

    border-radius: 8px;
  }

  .lightbox-close {
    position: absolute;

    top: 15px;

    right: 20px;

    border: 0;

    background: transparent;

    color: #ffffff;

    font-size: 40px;

    cursor: pointer;
  }

  /* =====================================
   TOAST
===================================== */

  .toast {
    position: fixed;

    right: 20px;

    bottom: 20px;

    max-width: 380px;

    padding: 14px 18px;

    border-radius: 9px;

    color: #ffffff;

    background: #198754;

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);

    transform: translateY(100px);

    opacity: 0;

    pointer-events: none;

    transition: 0.3s;

    z-index: 3000;
  }

  .toast.show {
    transform: translateY(0);

    opacity: 1;
  }

  .toast.error {
    background: #dc3545;
  }

  .toast.success {
    background: #198754;
  }

  /* =====================================
   LOADING
===================================== */

  .loading-overlay {
    position: fixed;

    inset: 0;

    background: rgba(255, 255, 255, 0.75);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 4000;

    backdrop-filter: blur(2px);
  }

  .loading-overlay.show {
    display: flex;
  }

  .loading-box {
    background: #ffffff;

    padding: 25px 30px;

    border-radius: 12px;

    box-shadow: var(--shadow);

    text-align: center;
  }

  .loading-box p {
    margin: 12px 0 0;

    color: var(--muted);
  }

  .spinner {
    width: 38px;

    height: 38px;

    border: 4px solid #e5e7eb;

    border-top-color: var(--primary);

    border-radius: 50%;

    animation: spin 0.8s linear infinite;

    margin: auto;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* =====================================
   MOBILE
===================================== */

  @media (max-width: 700px) {
    .header-inner {
      align-items: flex-start;

      flex-direction: column;
    }

    .header-inner .btn {
      width: 100%;
    }

    .toolbar {
      flex-direction: column;

      align-items: stretch;
    }

    .search-box {
      max-width: none;
    }

    .total-box {
      text-align: center;
    }

    .document-grid {
      grid-template-columns: 1fr;
    }

    .card-actions {
      grid-template-columns: 1fr 1fr;
    }
  }

  /* =====================================
   SMALL MOBILE
===================================== */

  @media (max-width: 430px) {
    .container {
      padding: 15px 12px 35px;
    }

    .header-inner {
      padding: 15px 12px;
    }

    .header-inner h1 {
      font-size: 21px;
    }

    .card-image {
      height: 200px;
    }

    .card-actions {
      grid-template-columns: 1fr;
    }

    .modal {
      padding: 10px;
    }

    .modal-box {
      max-height: 95vh;
    }

    .form-actions {
      flex-direction: column-reverse;
    }

    .form-actions .btn {
      width: 100%;
    }
  }
</style>
