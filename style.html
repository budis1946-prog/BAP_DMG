<style>

/*************************************************
 * RESET
 *************************************************/

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}


/*************************************************
 * HEADER
 *************************************************/

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #ffffff;
  border-bottom: 1px solid #e5e7eb;
}

.header-inner {
  max-width: 1250px;
  margin: auto;
  padding: 18px 24px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 5px 0 0;
  color: #6b7280;
  font-size: 14px;
}


/*************************************************
 * CONTAINER
 *************************************************/

.container {
  max-width: 1250px;
  margin: auto;
  padding: 25px 24px 50px;
}


/*************************************************
 * BUTTON
 *************************************************/

.btn {
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: 0.2s;
}

.btn:hover {
  transform: translateY(-1px);
  opacity: 0.9;
}

.primary {
  background: #2563eb;
  color: white;
}

.ghost {
  background: #eef2f7;
  color: #374151;
}

.pdf {
  background: #fee2e2;
  color: #b91c1c;
}

.download {
  background: #dcfce7;
  color: #15803d;
}

.edit {
  background: #fef3c7;
  color: #92400e;
}

.danger {
  background: #fee2e2;
  color: #b91c1c;
}


/*************************************************
 * TOOLBAR
 *************************************************/

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 25px;
}

.search-box {
  flex: 1;
}

.search-box input {
  width: 100%;
  border: 1px solid #d1d5db;
  background: white;
  border-radius: 10px;
  padding: 13px 15px;
  font-size: 15px;
  outline: none;
}

.search-box input:focus {
  border-color: #2563eb;
}

.total-box {
  min-width: 130px;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 10px 15px;
  text-align: center;
}

.total-box strong {
  display: block;
  font-size: 20px;
}

.total-box span {
  font-size: 12px;
  color: #6b7280;
}


/*************************************************
 * GRID
 *************************************************/

.document-grid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(290px, 1fr)
    );
  gap: 20px;
}


/*************************************************
 * CARD
 *************************************************/

.document-card {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  overflow: hidden;
  box-shadow:
    0 3px 12px
    rgba(0, 0, 0, 0.05);
}


/*************************************************
 * MAIN IMAGE
 *************************************************/

.card-image {
  width: 100%;
  height: 220px;
  background: #eef1f5;
  overflow: hidden;
  position: relative;
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  cursor: zoom-in;
  transition: transform 0.25s;
}

.card-image img:hover {
  transform: scale(1.04);
}

.card-image-placeholder {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 55px;
  color: #9ca3af;
}


/*************************************************
 * CARD BODY
 *************************************************/

.card-body {
  padding: 17px;
}

.card-name {
  margin: 0 0 8px;
  font-size: 19px;
  line-height: 1.3;
  word-break: break-word;
}

.card-description {
  margin: 0 0 10px;
  color: #6b7280;
  font-size: 14px;
  line-height: 1.5;

  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-date {
  color: #9ca3af;
  font-size: 12px;
  margin-bottom: 13px;
}


/*************************************************
 * GALLERY
 *************************************************/

.gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 15px;
}

.gallery img {
  width: 55px;
  height: 55px;
  border-radius: 7px;
  object-fit: cover;
  cursor: zoom-in;
  border: 1px solid #e5e7eb;
}


/*************************************************
 * ACTIONS
 *************************************************/

.card-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.card-actions .btn {
  flex: 1;
  min-width: 80px;
  padding: 9px 8px;
}


/*************************************************
 * EMPTY
 *************************************************/

.empty-state {
  background: white;
  border: 1px dashed #d1d5db;
  border-radius: 14px;
  padding: 60px 20px;
  text-align: center;
}

.empty-icon {
  font-size: 55px;
}

.empty-state h2 {
  margin: 15px 0 7px;
}

.empty-state p {
  color: #6b7280;
  margin-bottom: 20px;
}


/*************************************************
 * MODAL
 *************************************************/

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;

  background:
    rgba(15, 23, 42, 0.65);

  padding: 20px;

  overflow-y: auto;
}

.modal.show {
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-box {
  width: 100%;
  max-width: 650px;
  background: white;
  border-radius: 15px;
  box-shadow:
    0 20px 60px
    rgba(0, 0, 0, 0.2);

  overflow: hidden;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 18px 22px;

  border-bottom: 1px solid #e5e7eb;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.close-btn {
  border: 0;
  background: transparent;
  font-size: 30px;
  color: #6b7280;
  cursor: pointer;
  line-height: 1;
}


/*************************************************
 * FORM
 *************************************************/

#documentForm {
  padding: 22px;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-weight: 600;
  font-size: 14px;
}

.form-group label span {
  color: #dc2626;
}

.form-group input[type="text"],
.form-group textarea,
.form-group input[type="file"] {
  width: 100%;
}

.form-group input[type="text"],
.form-group textarea {
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 11px 13px;
  font-size: 14px;
  outline: none;
}

.form-group textarea {
  resize: vertical;
  min-height: 100px;
}

.form-group input[type="text"]:focus,
.form-group textarea:focus {
  border-color: #2563eb;
}

.form-group input[type="file"] {
  padding: 9px;
  background: #f9fafb;
  border: 1px dashed #cbd5e1;
  border-radius: 8px;
}

.form-group small {
  display: block;
  color: #9ca3af;
  margin-top: 5px;
  font-size: 12px;
}


/*************************************************
 * CURRENT FILE
 *************************************************/

.current-file {
  margin-top: 8px;
  font-size: 13px;
}

.current-file a {
  color: #2563eb;
  text-decoration: none;
}

.current-preview {
  margin-top: 10px;
}

.current-preview img {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}


/*************************************************
 * CHECKBOX
 *************************************************/

.checkbox-group {
  margin-bottom: 20px;
  background: #f8fafc;
  padding: 12px;
  border-radius: 8px;
}

.checkbox-group label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.checkbox-group input {
  width: 17px;
  height: 17px;
}


/*************************************************
 * FORM ACTION
 *************************************************/

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding-top: 5px;
}


/*************************************************
 * LIGHTBOX
 *************************************************/

.lightbox {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 2000;

  background:
    rgba(0, 0, 0, 0.88);

  align-items: center;
  justify-content: center;

  padding: 30px;
}

.lightbox.show {
  display: flex;
}

.lightbox img {
  max-width: 95vw;
  max-height: 90vh;
  object-fit: contain;
  border-radius: 8px;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 25px;

  border: 0;
  background: transparent;

  color: white;
  font-size: 42px;
  cursor: pointer;
}


/*************************************************
 * TOAST
 *************************************************/

.toast {
  position: fixed;

  right: 20px;
  bottom: 20px;

  z-index: 3000;

  background: #16a34a;
  color: white;

  padding: 13px 18px;
  border-radius: 9px;

  box-shadow:
    0 10px 30px
    rgba(0, 0, 0, 0.15);

  transform:
    translateY(20px);

  opacity: 0;
  pointer-events: none;

  transition: 0.25s;

  max-width: 380px;
}

.toast.show {
  transform:
    translateY(0);

  opacity: 1;
}

.toast.error {
  background: #dc2626;
}


/*************************************************
 * LOADING
 *************************************************/

.loading-overlay {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 2500;

  background:
    rgba(255, 255, 255, 0.78);

  align-items: center;
  justify-content: center;

  flex-direction: column;

  gap: 13px;

  color: #374151;
  font-weight: 600;
}

.loading-overlay.show {
  display: flex;
}

.spinner {
  width: 40px;
  height: 40px;

  border: 4px solid #e5e7eb;
  border-top-color: #2563eb;

  border-radius: 50%;

  animation:
    spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}


/*************************************************
 * INITIAL LOADING
 *************************************************/

.initial-loading {
  text-align: center;
  padding: 50px;
  color: #6b7280;
}


/*************************************************
 * UTILITIES
 *************************************************/

.hidden {
  display: none !important;
}


/*************************************************
 * RESPONSIVE
 *************************************************/

@media (max-width: 700px) {

  .header-inner {
    padding: 15px;
  }

  .header h1 {
    font-size: 20px;
  }

  .header-inner .btn {
    white-space: nowrap;
  }

  .container {
    padding: 18px 15px 40px;
  }

  .toolbar {
    flex-direction: column;
    align-items: stretch;
  }

  .total-box {
    width: 100%;
  }

  .document-grid {
    grid-template-columns: 1fr;
  }

  .card-image {
    height: 240px;
  }

}


@media (max-width: 430px) {

  .header-inner {
    flex-direction: column;
    align-items: stretch;
  }

  .header-inner .btn {
    width: 100%;
  }

  .card-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .card-actions .btn {
    min-width: 0;
  }

  .modal {
    padding: 10px;
  }

  #documentForm {
    padding: 17px;
  }

}

</style>
