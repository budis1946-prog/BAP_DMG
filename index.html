<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document Manager</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="header-inner">
        <div>
          <h1>Document Manager</h1>
          <p>Dashboard Dokumen</p>
        </div>

        <button class="btn primary" onclick="openCreateModal()">
          + Tambah Dokumen
        </button>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <div class="search-box">
          <input
            type="text"
            id="searchInput"
            placeholder="Cari dokumen..."
            oninput="renderDocuments()"
          />
        </div>

        <div class="total-box">
          Total:
          <strong id="totalDocuments">0</strong>
        </div>
      </div>

      <section id="documentGrid" class="document-grid"></section>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">📄</div>

        <h2>Belum ada dokumen</h2>

        <p>Silakan tambahkan dokumen.</p>
      </div>
    </main>

    <!-- MODAL -->

    <div id="modal" class="modal">
      <div class="modal-box">
        <div class="modal-header">
          <div>
            <h2 id="modalTitle">Tambah Dokumen</h2>
            <p>Lengkapi data dokumen</p>
          </div>

          <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <form id="documentForm">
          <input type="hidden" id="documentId" />

          <div class="form-group">
            <label> Nama Dokumen <span>*</span> </label>

            <input
              type="text"
              id="documentName"
              required
              placeholder="Nama dokumen"
            />
          </div>

          <div class="form-group">
            <label>Deskripsi</label>

            <textarea
              id="description"
              rows="4"
              placeholder="Deskripsi dokumen"
            ></textarea>
          </div>

          <div class="form-group">
            <label>File PDF</label>

            <input type="file" id="pdfFile" accept="application/pdf" />
          </div>

          <div class="form-group">
            <label>Gambar Utama</label>

            <input type="file" id="mainImageFile" accept="image/*" />
          </div>

          <div class="form-group">
            <label>Gambar Tambahan</label>

            <input type="file" id="extraImageFiles" accept="image/*" multiple />
          </div>

          <div
            id="replaceExtraContainer"
            class="checkbox-group"
            style="display: none"
          >
            <label>
              <input type="checkbox" id="replaceExtraImages" />

              Ganti seluruh gambar tambahan
            </label>
          </div>

          <div class="form-actions">
            <button type="button" class="btn ghost" onclick="closeModal()">
              Batal
            </button>

            <button type="submit" class="btn primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <!-- LIGHTBOX -->

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
      <button class="lightbox-close" onclick="closeLightbox()">×</button>

      <img
        id="lightboxImage"
        src=""
        alt="Preview"
        onclick="event.stopPropagation()"
      />
    </div>

    <!-- TOAST -->

    <div id="toast" class="toast"></div>

    <!-- LOADING -->

    <div id="loading" class="loading-overlay">
      <div class="loading-box">
        <div class="spinner"></div>

        <p id="loadingText">Memproses...</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
